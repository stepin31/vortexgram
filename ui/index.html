<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VortexGram Next</title>
<style>
  :root {
    --bg-base: #06080d;
    --bg-surface: rgba(18, 22, 33, 0.75);
    --bg-elevated: rgba(27, 33, 48, 0.8);
    --accent: #8b5cf6;
    --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    --accent-glow: rgba(139, 92, 246, 0.4);
    --danger: #f43f5e;
    --danger-soft: rgba(244, 63, 94, 0.15);
    --warning: #fbbf24;
    --success: #10b981;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .auth-screen {
    position: fixed; inset: 0; background: rgba(6, 8, 13, 0.94); backdrop-filter: blur(20px);
    z-index: 300; display: flex; flex-direction: column; justify-content: center; padding: 24px;
  }
  .auth-screen.hidden { display: none; }
  .auth-card {
    background: var(--bg-surface); backdrop-filter: blur(16px); border: 1px solid var(--border);
    border-radius: 28px; padding: 24px 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.8);
  }
  .auth-logo {
    width: 60px; height: 60px; border-radius: 20px; background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px;
    box-shadow: 0 10px 30px var(--accent-glow);
  }
  .auth-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .auth-sub { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.4; }
  .field-group { margin-bottom: 12px; }
  .field-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
  .auth-input {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main);
    padding: 13px 16px; border-radius: 16px; font-size: 14px; outline: none;
  }
  .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  .primary-btn {
    width: 100%; background: var(--accent-gradient); color: #fff; border: none; padding: 14px;
    border-radius: 16px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .demo-btn { width: 100%; background: transparent; color: var(--text-muted); border: 1px dashed var(--border); padding: 10px; border-radius: 14px; font-size: 12px; cursor: pointer; margin-top: 12px; }
  .auth-status { margin-top: 12px; font-size: 12px; text-align: center; color: var(--danger); min-height: 16px; }

  /* БОКОВОЕ МЕНЮ */
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 150; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 85%; max-width: 330px;
    background: rgba(18, 22, 33, 0.9); backdrop-filter: blur(24px); border-right: 1px solid var(--border);
    z-index: 160; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-brand { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .sync-btn { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-main); padding: 7px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; }

  .dialogs-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .dialog-item {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,0.01); border: 1px solid transparent; transition: 0.2s;
  }
  .dialog-item.active { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.35); }
  .dialog-avatar {
    width: 46px; height: 46px; border-radius: 16px; background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .dialog-meta { flex: 1; overflow: hidden; }
  .dialog-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .unread-pill { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }

  /* ВЕРХНИЙ БАР */
  .app-header { background: var(--bg-surface); backdrop-filter: blur(16px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 10; }
  .left-controls { display: flex; align-items: center; gap: 10px; }
  .menu-btn { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 14px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .user-title h1 { font-size: 15px; font-weight: 600; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-title p { font-size: 11px; color: var(--success); }
  .ghost-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); }

  /* ШТОРКА ПРИЗРАКА */
  .ghost-drawer { background: var(--bg-surface); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 14px 16px; display: block; z-index: 10; }
  .ghost-drawer.hidden { display: none; }
  .toggles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .toggle-card { background: var(--bg-elevated); border: 1px solid var(--border); padding: 10px 12px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; cursor: pointer; }
  .toggle-card.active { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.12); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5563; }
  .toggle-card.active .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .sim-bar { display: flex; gap: 8px; }
  .sim-btn { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 12px; font-size: 11px; cursor: pointer; }

  /* ВКЛАДКА ПРОКСИ-ЦЕНТРА */
  .proxy-container { padding: 12px 16px; background: rgba(18,22,33,0.9); border-bottom: 1px solid var(--border); }

  /* ЧАТ ЛЕНТА */
  .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
  .msg-row { display: flex; flex-direction: column; max-width: 82%; }
  .msg-row.incoming { align-self: flex-start; }
  .msg-row.outgoing { align-self: flex-end; }
  .sender-name { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 3px; margin-left: 4px; }
  .bubble { padding: 12px 16px; border-radius: 20px; font-size: 14px; line-height: 1.45; background: var(--bg-surface); backdrop-filter: blur(12px); border: 1px solid var(--border); word-break: break-word; }
  .outgoing .bubble { background: var(--accent-gradient); color: #fff; border: none; box-shadow: 0 6px 20px var(--accent-glow); border-bottom-right-radius: 6px; }
  .incoming .bubble { border-bottom-left-radius: 6px; }
  .bubble.deleted { background: var(--danger-soft); border-color: rgba(244, 63, 94, 0.35); }

  .meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
  .outgoing .meta { color: rgba(255,255,255,0.75); }
  .badge { padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; }
  .badge-del { background: rgba(244, 63, 94, 0.2); color: var(--danger); border: 1px solid rgba(244,63,94,0.3); }
  .badge-edit { background: rgba(251, 191, 36, 0.15); color: var(--warning); cursor: pointer; border: 1px solid rgba(251,191,36,0.3); }

  /* ВВОД */
  .input-bar { background: var(--bg-surface); backdrop-filter: blur(16px); padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 10; }
  .msg-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main); padding: 12px 18px; border-radius: 24px; font-size: 14px; outline: none; }
  .msg-input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); border: none; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--accent-glow); }

  /* МОДАЛКА */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); display: none; align-items: flex-end; z-index: 250; }
  .modal.open { display: flex; }
  .sheet { width: 100%; background: rgba(18, 22, 33, 0.95); backdrop-filter: blur(24px); border-top: 1px solid var(--border); border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 24px; max-height: 75vh; overflow-y: auto; }
  .diff-card { background: var(--bg-elevated); border-left: 3px solid var(--accent); padding: 12px; border-radius: 14px; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>

<!-- АВТОРИЗАЦИЯ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">⚡</div>
    <div class="auth-title">VortexGram Next</div>
    <div class="auth-sub">MTProto клиент на Rust & <b>grammers</b> с локальным чекером прокси</div>

    <div id="stepPhone">
      <div class="field-group"><label class="field-label">API ID (my.telegram.org)</label><input class="auth-input" id="apiId" type="number" placeholder="12345678"></div>
      <div class="field-group"><label class="field-label">API Hash</label><input class="auth-input" id="apiHash" type="text" placeholder="хеш"></div>
      <div class="field-group"><label class="field-label">Телефон</label><input class="auth-input" id="phone" type="tel" placeholder="+79001234567"></div>
      <button class="primary-btn" onclick="requestCode()">Получить код</button>
    </div>
    <div id="stepCode" style="display:none;">
      <div class="field-group"><label class="field-label">Код из Telegram</label><input class="auth-input" id="loginCode" type="number" placeholder="12345"></div>
      <button class="primary-btn" onclick="verifyCode()">Войти</button>
    </div>
    <div id="step2FA" style="display:none;">
      <div class="field-group"><label class="field-label">Пароль 2FA</label><input class="auth-input" id="pwd2fa" type="password" placeholder="Пароль"></div>
      <button class="primary-btn" onclick="verify2FA()">Подтвердить</button>
    </div>
    <div class="auth-status" id="authStatus"></div>
    <button class="demo-btn" onclick="skipToDemo()">Пропустить (Демо-режим)</button>
  </div>
</div>

<!-- БОКОВОЕ МЕНЮ -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand"><span>💬</span> Чаты</div>
    <button class="sync-btn" onclick="syncTelegramDialogs()">🔄 Синхр.</button>
  </div>
  <div class="dialogs-list" id="dialogsList"></div>
</div>

<!-- ВЕРХНИЙ БАР -->
<div class="app-header">
  <div class="left-controls">
    <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
    <div class="user-title">
      <h1 id="currentChatTitle">Загрузка...</h1>
      <p>● Режим Призрака активен</p>
    </div>
  </div>
  <button class="ghost-btn" onclick="document.getElementById('drawer').classList.toggle('hidden')">👻 Призрак</button>
</div>

<!-- ШТОРКА ПРИЗРАКА -->
<div class="ghost-drawer hidden" id="drawer">
  <div class="toggles-grid">
    <div class="toggle-card active" id="btn-anti_delete" onclick="toggle('anti_delete')"><span>Анти-удаление</span><div class="dot"></div></div>
    <div class="toggle-card active" id="btn-no_read" onclick="toggle('no_read')"><span>Не читать</span><div class="dot"></div></div>
    <div class="toggle-card active" id="btn-hide_online" onclick="toggle('hide_online')"><span>Скрыть онлайн</span><div class="dot"></div></div>
    <div class="toggle-card active" id="btn-save_edits" onclick="toggle('save_edits')"><span>Лог правок</span><div class="dot"></div></div>
  </div>
  <div class="sim-bar">
    <button class="sim-btn" onclick="simDelete()">🔥 Тест: Удалить</button>
    <button class="sim-btn" onclick="simEdit()">✏️ Тест: Изменить</button>
  </div>
</div>

<!-- ПАНЕЛЬ ПРОКСИ-КОЛЛЕКТОРА -->
<div class="proxy-container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span style="font-size:12px; font-weight:700; color:var(--text-muted);">⚡ ТОП ПРОКСИ (COLLECTOR)</span>
    <button class="sync-btn" style="padding:4px 8px; font-size:10px;" onclick="loadProxies()">Проверить пинг</button>
  </div>
  <div id="proxyQuickList" style="font-size:12px; color:var(--text-muted);">Нажми «Проверить пинг», чтобы подгрузить рабочие сервера.</div>
</div>

<!-- ЧАТ -->
<div class="chat-area" id="chat"></div>

<!-- ВВОД -->
<div class="input-bar">
  <input class="msg-input" id="inp" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') send()">
  <button class="send-btn" onclick="send()">➤</button>
</div>

<!-- ИСТОРИЯ ПРАВОК -->
<div class="modal" id="modal" onclick="this.classList.remove('open')">
  <div class="sheet" onclick="event.stopPropagation()">
    <h3 style="font-size:16px; margin-bottom:8px; font-weight:700;">История изменений (SQLite)</h3>
    <div id="diffList"></div>
  </div>
</div>

<script>
  const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : null;
  const listen = window.__TAURI__ && window.__TAURI__.event ? window.__TAURI__.event.listen : null;
  
  let cachedMessages = [];
  let currentChatId = 1001;

  async function init() {
    if (!invoke) return;
    if (listen) {
      await listen('db-updated', async () => {
        const [, dialogs, activeId, messages] = await invoke('get_initial_data');
        currentChatId = activeId;
        renderDialogs(dialogs);
        renderMessages(messages);
      });
    }
    try {
      if (await invoke('check_auth_status')) {
        document.getElementById('authScreen').classList.add('hidden');
        syncTelegramDialogs();
      }
    } catch (e) {}

    const [settings, dialogs, activeId, messages] = await invoke('get_initial_data');
    currentChatId = activeId;
    updateSettingsUI(settings);
    renderDialogs(dialogs);
    renderMessages(messages);
    loadProxies();
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
    document.getElementById('sidebarBackdrop').classList.toggle('open', open);
  }

  async function loadProxies() {
    if (!invoke) return;
    const box = document.getElementById('proxyQuickList');
    box.innerHTML = 'Сканирование пинга серверов...';
    try {
      const proxies = await invoke('get_fast_proxies');
      if (proxies.length === 0) { box.innerHTML = 'Нет доступных прокси'; return; }
      box.innerHTML = '';
      proxies.slice(0, 2).forEach(p => {
        const el = document.createElement('div');
        el.style.display = 'flex'; el.style.justifyContent = 'space-between'; el.style.alignItems = 'center'; el.style.marginTop = '4px';
        el.innerHTML = `<span>🌐 ${p.region} (${p.host}:${p.port}) — <b style="color:var(--success);">${p.ping_ms} мс</b></span> <a href="${p.url}" style="color:var(--accent); font-weight:600; text-decoration:none;">Вкл</a>`;
        box.appendChild(el);
      });
    } catch(e) { box.innerHTML = 'Ошибка чека прокси'; }
  }

  function renderDialogs(dialogs) {
    const container = document.getElementById('dialogsList');
    container.innerHTML = '';
    const activeObj = dialogs.find(d => d.id === currentChatId);
    if (activeObj) document.getElementById('currentChatTitle').textContent = activeObj.title;

    dialogs.forEach(d => {
      const item = document.createElement('div');
      item.className = 'dialog-item ' + (d.id === currentChatId ? 'active' : '');
      item.onclick = () => switchChat(d.id, d.title);
      item.innerHTML = `
        <div class="dialog-avatar">${(d.title || '?')[0].toUpperCase()}</div>
        <div class="dialog-meta">
          <div class="dialog-title">${d.title}</div>
          <div class="dialog-preview">${d.last_message || 'Нет сообщений'}</div>
        </div>
        ${d.unread > 0 ? `<span class="unread-pill">${d.unread}</span>` : ''}
      `;
      container.appendChild(item);
    });
  }

  async function switchChat(chatId, title) {
    currentChatId = chatId;
    document.getElementById('currentChatTitle').textContent = title;
    toggleSidebar(false);
    if (!invoke) return;
    renderMessages(await invoke('select_chat', { chatId }));
  }

  async function syncTelegramDialogs() {
    if (!invoke) return;
    try {
      const dialogs = await invoke('sync_dialogs');
      renderDialogs(dialogs);
      if (dialogs.length > 0) await switchChat(dialogs[0].id, dialogs[0].title);
    } catch (e) {}
  }

  async function requestCode() {
    const apiId = parseInt(document.getElementById('apiId').value.trim(), 10);
    const apiHash = document.getElementById('apiHash').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const status = document.getElementById('authStatus');
    if (!apiId || !apiHash || !phone) { status.textContent = "Заполните поля"; return; }
    try {
      await invoke('auth_request_code', { apiId, apiHash, phone });
      document.getElementById('stepPhone').style.display = 'none';
      document.getElementById('stepCode').style.display = 'block';
      status.style.color = "var(--success)"; status.textContent = "Код отправлен!";
    } catch (err) { status.textContent = err; }
  }

  async function verifyCode() {
    const code = document.getElementById('loginCode').value.trim();
    try {
      const res = await invoke('auth_verify_code', { code });
      if (res === "2FA_REQUIRED") {
        document.getElementById('stepCode').style.display = 'none';
        document.getElementById('step2FA').style.display = 'block';
      } else {
        document.getElementById('authScreen').classList.add('hidden');
        syncTelegramDialogs();
      }
    } catch (err) { document.getElementById('authStatus').textContent = err; }
  }

  async function verify2FA() {
    const password = document.getElementById('pwd2fa').value;
    try {
      await invoke('auth_verify_2fa', { password });
      document.getElementById('authScreen').classList.add('hidden');
      syncTelegramDialogs();
    } catch (err) { document.getElementById('authStatus').textContent = err; }
  }

  function skipToDemo() { document.getElementById('authScreen').classList.add('hidden'); }

  function updateSettingsUI(s) {
    ['anti_delete', 'no_read', 'hide_online', 'save_edits'].forEach(k => {
      const el = document.getElementById('btn-' + k);
      if (el) el.classList.toggle('active', s[k]);
    });
  }

  function renderMessages(msgs) {
    cachedMessages = msgs;
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    msgs.forEach(m => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (m.is_outgoing ? 'outgoing' : 'incoming');
      let badges = '';
      if (m.is_deleted) badges += `<span class="badge badge-del">🗑️ удалено</span>`;
      if (m.edits && m.edits.length > 0) badges += `<span class="badge badge-edit" onclick="showEdits(${m.id})">✏️ изм. (${m.edits.length})</span>`;
      
      row.innerHTML = `
        <div class="bubble ${m.is_deleted ? 'deleted' : ''}">
          ${!m.is_outgoing ? `<div class="sender-name">${m.sender}</div>` : ''}
          <div>${m.text}</div>
          <div class="meta">${badges} <span>${m.time}</span></div>
        </div>
      `;
      chat.appendChild(row);
    });
    chat.scrollTop = chat.scrollHeight;
  }

  async function toggle(key) {
    if (!invoke) return;
    updateSettingsUI(await invoke('toggle_setting', { key }));
  }

  async function send() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text || !invoke) return;
    inp.value = '';
    renderMessages(await invoke('send_message', { text }));
  }

  async function simDelete() {
    if (!invoke || cachedMessages.length === 0) return;
    renderMessages(await invoke('intercept_delete', { msgId: cachedMessages[0].id }));
  }

  async function simEdit() {
    if (!invoke || cachedMessages.length === 0) return;
    const target = cachedMessages[cachedMessages.length - 1];
    renderMessages(await invoke('intercept_edit', { msgId: target.id, newText: target.text + " (ред.)" }));
  }

  function showEdits(id) {
    const msg = cachedMessages.find(x => x.id === id);
    if (!msg) return;
    const list = document.getElementById('diffList');
    list.innerHTML = '';
    msg.edits.forEach(e => {
      list.innerHTML += `<div class="diff-card"><div style="font-size:11px;color:var(--text-muted)">${e.edit_time} (Оригинал)</div><div>${e.old_text}</div></div>`;
    });
    list.innerHTML += `<div class="diff-card" style="border-left-color:var(--success)"><div style="font-size:11px;color:var(--success)">Текущая версия</div><div>${msg.text}</div></div>`;
    document.getElementById('modal').classList.add('open');
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
