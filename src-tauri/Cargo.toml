[package]
name = "vortexgram"
version = "0.5.0"
description = "Advanced AyuGram-style Telegram client on Rust with Media Safe & Proxy Collector"
authors = ["StealthDev"]
edition = "2021"

[lib]
name = "vortexgram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
grammers-client = "0.11"
grammers-session = "0.11"
grammers-tl-types = "0.11"
# Важно: rustls-tls избавляет от необходимости кросс-компилировать системный OpenSSL под Android
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
